# Musical constants for the whole project. Mirrors docs/music_spec.md.
#
# Owner: Member A (music lead). Load it through src/music/spec.py, never by hand,
# and never copy these numbers into other code.
#
# Values are spec DEFAULTS unless their key is listed under `decided`.
# When you change anything here, update docs/music_spec.md and its change log too,
# and bump `version`.

version: "0.6"

# Dotted keys the music lead has signed off on. Everything else is a default,
# and `null` means the spec has no answer yet.
decided:
  - drum_map                                    # spec §1, all rows (2026-10-20)
  - same_rhythm.steps_per_beat
  - same_rhythm.ghost_velocity_below
  - same_rhythm.flam_merge_ms
  - same_rhythm.flam_keep                       # 2026-10-28
  - same_rhythm.flam_chain                      # 2026-10-28
  - same_rhythm.midpoint_priority               # 2026-10-28
  - same_rhythm.swing_is_different
  - same_rhythm.half_time_double_time_different
  - same_rhythm.min_hits_per_loop
  - same_rhythm.match                           # 2026-10-28
  - loops.bars
  - loops.time_signatures
  - loops.start_on_downbeat
  - loops.boundary                              # 2026-10-28
  - loops.exclude_fills
  - loops.start_at_first_bar_with
  - loops.drop_last_bars
  - loops.performance_tempo_bpm
  - loops.hop_bars                              # 2026-10-28
  - loops.max_loops_per_performance
  - loops.remove_duplicates_within_performance
  - loops.audio                                 # 2026-11-09
  - rendering.tempo_bpm
  - rendering.max_tempo_change_pct              # 2026-11-09: recorded tempo only for v0
  - rendering.loudness_normalize
  - rendering.keep_performer_velocities
  - rendering.kits                              # 2026-11-09: draft maps kept for v0; splits set; 2026-11-10: no wrong articulations heard
  # 2026-10-28: spec §5-7, provisional until the §9 listening checks.
  - beatbox.avp_labels
  - beatbox.avp_modes
  - beatbox.avp_recordings
  - beatbox.sound_end
  - beatbox.choke_at_next_sound                # 2026-11-10
  - beatbox.simultaneous_priority
  - beatbox.skip_velocity_below
  - beatbox.thin_16th_hats_to_8ths_prob
  - beatbox.voice_cymbals_and_toms
  - beatbox.open_hat_sound
  - beatbox.hats_sound
  - sloppiness.offset_ms
  - sloppiness.jitter_ms
  - sloppiness.tempo_drift_pct
  - sloppiness.drop_prob
  - sloppiness.snr_db
  - taps.low
  - taps.high
  - taps.simultaneous

# The rhythm voices, in grid row order.
voices: [kick, snare, hats]

# --- Spec §1: drum grouping --------------------------------------------------
# GMD MIDI note -> voice, or `drop`. Note numbers are GMD's (Roland TD-11).
# Dropped hits leave the rhythm label and the fake beatbox but stay in rendered audio.
drum_map:
  kick:              {notes: [36], group: kick}
  snare_head:        {notes: [38], group: snare}
  snare_rimshot:     {notes: [40], group: snare}
  snare_cross_stick: {notes: [37], group: snare}
  toms:              {notes: [48, 50, 45, 47, 43, 58], group: drop}
  hihat_closed:      {notes: [42, 22], group: hats}
  hihat_open:        {notes: [46, 26], group: hats}
  hihat_pedal:       {notes: [44], group: hats}
  ride:              {notes: [51, 59], group: hats}
  ride_bell:         {notes: [53], group: hats}
  crash:             {notes: [49, 55, 57, 52], group: drop}

# --- Spec §2: what counts as the same rhythm ----------------------------------
same_rhythm:
  steps_per_beat: 12
  # Hits with velocity below this are ignored. Either one number for every voice,
  # or a mapping per voice, e.g. {kick: 30, snare: 40, hats: 25}.
  ghost_velocity_below: 15
  flam_merge_ms: 30                 # same-voice hits closer than this become one hit
  flam_keep: loudest                # the merged hit takes the loudest hit's timing; ties: the earlier
  flam_chain: true                  # a run of hits, each closer than flam_merge_ms to the next, is one hit
  # A hit exactly halfway between two steps goes to the simpler position. Subdivisions
  # per beat, simplest first: beat, 8th, then 16th or triplet. Equal ranks: the later step.
  midpoint_priority: [[1], [2], [3, 4]]
  swing_is_different: true          # swung and straight versions are different rhythms
  half_time_double_time_different: true
  min_hits_per_loop: {kick: 1, snare: 1}
  # Two clips are the same rhythm only when their grids are identical (same pattern_id).
  # Near misses are scored separately by D, not counted as matches.
  match: exact

# --- Spec §3: cutting loops ----------------------------------------------------
loops:
  bars: 2
  time_signatures: ["4-4"]          # GMD's info.csv format
  start_on_downbeat: true
  # Which loop a hit near a bar line belongs to. nearest_step: the bar its nearest grid
  # step falls in, so a downbeat played a little early stays the downbeat. raw: its time.
  boundary: nearest_step
  exclude_fills: true               # GMD beat_type == fill
  start_at_first_bar_with: [kick, snare]  # skips count-ins
  drop_last_bars: 1                 # skips endings
  performance_tempo_bpm: [70, 160]  # leave out performances recorded outside this
  hop_bars: 2                       # bars 1-2, 3-4, ...: loops never overlap
  max_loops_per_performance: null   # null = no limit
  remove_duplicates_within_performance: true
  # Audio framing for every clip, library loops and fake beatbox queries alike: a lead-in
  # before the first downbeat, then a cut at the end of the last bar with a short fade.
  audio:
    lead_in_s: 0.25                 # so hits played a little early aren't cut off
    end: cut                        # cut: stop at the end of the last bar; ring: let tails decay
    end_fade_ms: 20                 # fade-out at the cut

# --- Spec §4: drum kits and rendering ------------------------------------------
rendering:
  tempo_bpm: [70, 160]
  # v0 (2026-11-09): every loop renders at its recorded tempo. ±20% (decided 2026-10-28,
  # provisional) comes back after the class presentation, once checked by ear.
  max_tempo_change_pct: 0
  loudness_normalize: true
  keep_performer_velocities: true
  # Kits (spec §4). Each note_map was drafted on 2026-11-04 from the kit's sample names.
  # 2026-11-09: the drafts are kept for v0 (refine by ear after the presentation), and
  # splits are set: test = salamander, muldjordkit; train = drskit and the four AVL kits.
  # Validation uses the training kits. split null = not used (gogodze can't render yet).
  # Paths are under data/raw/kits (python -m tools.download_datasets kits).
  # note_map takes every drum_map note, in this order:
  #   kick 36 | snare head 38, rimshot 40, cross-stick 37 | toms (head, rim) 48 50, 45 47,
  #   43 58 | hats (bow, edge) closed 42 22, open 46 26, pedal 44 | ride 51 59, bell 53 |
  #   crashes 49 55, 57 52
  # A value is the kit's key, {key: K, cc: {CC: value}} to send a CC with that note, or
  # null for no sound (dropped notes only: labelled hits must sound).
  kits:
    - kit_id: avl_black_pearl
      type: acoustic
      program: "avl_black_pearl/BLACK_PEARL_2023_repack/Black_Pearl_2023_repack.sfz"
      samples: null
      split: train
      controls: {}
      # Pearl kit. AVL kits have 2 toms (45, floor 41) with edge hits on 47 and 43, and
      # 46 is a semi-open hat.
      note_map: {36: 36, 38: 38, 40: 40, 37: 37,
                 48: 45, 50: 47, 45: 45, 47: 47, 43: 41, 58: 43,
                 42: 42, 22: 42, 46: 46, 26: 46, 44: 44,
                 51: 51, 59: 59, 53: 53, 49: 49, 55: 49, 57: 57, 52: 57}
    - kit_id: avl_red_zeppelin
      type: acoustic
      program: "avl_red_zeppelin/RED_ZEPPELIN_2023_repack/Red_Zeppelin_2023_repack.sfz"
      samples: null
      split: train
      controls: {}
      # Ludwig kit with a 26-inch kick; same layout as Black Pearl.
      note_map: {36: 36, 38: 38, 40: 40, 37: 37,
                 48: 45, 50: 47, 45: 45, 47: 47, 43: 41, 58: 43,
                 42: 42, 22: 42, 46: 46, 26: 46, 44: 44,
                 51: 51, 59: 59, 53: 53, 49: 49, 55: 49, 57: 57, 52: 57}
    - kit_id: avl_blonde_bop
      type: acoustic
      program: "avl_blonde_bop/BLONDE_BOP_SFZ/BLONDE_BOP.sfz"
      samples: null
      split: train
      controls: {}
      # TAMA bop kit (18-inch kick, 10- and 14-inch toms) with sticks; same layout.
      note_map: {36: 36, 38: 38, 40: 40, 37: 37,
                 48: 45, 50: 47, 45: 45, 47: 47, 43: 41, 58: 43,
                 42: 42, 22: 42, 46: 46, 26: 46, 44: 44,
                 51: 51, 59: 59, 53: 53, 49: 49, 55: 49, 57: 57, 52: 57}
    - kit_id: avl_blonde_bop_hr
      type: acoustic
      program: "avl_blonde_bop_hr/BLONDE_BOP_HR_SFZ/BLONDE_BOP_HR.sfz"
      samples: null
      split: train
      controls: {}
      # Blonde Bop played with Hot Rods; same layout.
      note_map: {36: 36, 38: 38, 40: 40, 37: 37,
                 48: 45, 50: 47, 45: 45, 47: 47, 43: 41, 58: 43,
                 42: 42, 22: 42, 46: 46, 26: 46, 44: 44,
                 51: 51, 59: 59, 53: 53, 49: 49, 55: 49, 57: 57, 52: 57}
    - kit_id: drskit
      type: acoustic
      program: "drskit/DrumGizmo.DRSKit-b01448990a31f722542f1812e56159a97a6a2a82/DrumGizmo/DRSKit/Stereo/DrumGizmo DRSKit.sfz"
      samples: null
      split: train
      controls: {}
      # Full program, whisker hits included. 37 is 'Snare_rim', 40 'Snare_rest' (which one
      # is the cross-stick is for your ears). Toms 47, 43, 41. Hats: 56 closed (tip), 42
      # closed shank, 61 open tip, 58 open, 44 foot. Ride: 51 tip, 66 shank, 53 shank bell.
      # Crashes: shank hits on 49 (left) and 57 (right).
      note_map: {36: 36, 38: 38, 40: 40, 37: 37,
                 48: 47, 50: 47, 45: 43, 47: 43, 43: 41, 58: 41,
                 42: 56, 22: 42, 46: 61, 26: 58, 44: 44,
                 51: 51, 59: 66, 53: 53, 49: 49, 55: 49, 57: 57, 52: 57}
    - kit_id: muldjordkit
      type: acoustic
      program: "muldjordkit/DrumGizmo.MuldjordKit-fc165714974aa843125ce88597f341b31376e1d5/DrumGizmo/MuldjordKit/Stereo/DrumGizmo MuldjordKit.sfz"
      samples: null
      split: test
      controls: {}
      # 4 toms (48, 47, 45, 41). 37 'SnareRest' is the only stick sound besides the head,
      # so the rimshot and cross-stick both use it. 46 is the only open-hat articulation;
      # no pedal hat (44 is a choke), so the pedal borrows the closed hat.
      note_map: {36: 36, 38: 38, 40: 37, 37: 37,
                 48: 48, 50: 48, 45: 47, 47: 47, 43: 41, 58: 41,
                 42: 42, 22: 42, 46: 46, 26: 46, 44: 42,
                 51: 51, 59: 51, 53: 53, 49: 49, 55: 49, 57: 57, 52: 57}
    - kit_id: salamander
      type: acoustic
      program: "salamander_sfz/Salamander-Drumkit-9e9c9fca9f26e1763435beca4170505d0fa32fb0/Salamander Drumkit.sfz"
      samples: salamander
      split: test
      controls: {}
      # kinwie's mapping of the original samples: 36 kick 2, 38 snare 2, 41 snare stick,
      # toms 45 (high) and 43 (low), ride 1 on 52 with its bell on 53, crashes 55 and 57.
      # No rimshot samples.
      note_map: {36: 36, 38: 38, 40: 38, 37: 41,
                 48: 45, 50: 45, 45: 45, 47: 45, 43: 43, 58: 43,
                 42: 42, 22: 42, 46: 46, 26: 46, 44: 44,
                 51: 52, 59: 52, 53: 53, 49: 55, 55: 55, 57: 57, 52: 57}
    - kit_id: gogodze_phu_vol_ii
      type: lo-fi
      program: "gogodze_phu_vol_ii/Gogodze_Phu_vol_II/Programs/Kit.sfz"
      samples: null
      split: null
      controls: {}
      # Hat on 46 by openness (CC4: 0 closed, 127 open), 42 tight, 44 foot; toms 45, 43, 41.
      # No ride or cymbals: the ride borrows the closed hat and crashes stay silent. The
      # sampler can't play this program yet (it uses pitch, mic delays, and filters).
      note_map: {36: 36, 38: 38, 40: 40, 37: 37,
                 48: 45, 50: 45, 45: 43, 47: 43, 43: 41, 58: 41,
                 42: {key: 46, cc: {4: 0}}, 22: {key: 46, cc: {4: 0}}, 46: {key: 46, cc: {4: 127}}, 26: {key: 46, cc: {4: 127}}, 44: 44,
                 51: {key: 46, cc: {4: 0}}, 59: {key: 46, cc: {4: 0}}, 53: {key: 46, cc: {4: 0}},
                 49: null, 55: null, 57: null, 52: null}

# --- Spec §5: how people beatbox a beat ----------------------------------------
# One fake query uses one participant's sounds from one mode.
beatbox:
  avp_labels: [kd, sd, hhc, hho]    # AVP sound classes that may be used
  avp_modes: [personal, fixed]      # AVP imitation modes to draw sounds from
  avp_recordings: [isolated, improvisation]  # single-sound takes and/or improvisations
  # AVP marks only where a sound starts. It ends where its level falls `below_peak_db`
  # under its peak, or at the next annotated sound if `stop_at_next_onset`, or after
  # `max_ms`, whichever comes first, then fades out over `fade_ms`.
  sound_end: {below_peak_db: 30, max_ms: 500, fade_ms: 10, stop_at_next_onset: true}
  # One mouth makes one sound at a time (approved by ear 2026-11-10): in a fake query, each
  # sound stops where the next sound actually played starts (after timing sloppiness;
  # dropped hits don't count), fading out over `sound_end.fade_ms` so the fade ends there.
  # A gap shorter than the fade fades over the whole gap. false lets tails overlap.
  choke_at_next_sound: true
  simultaneous_priority: [kick, snare, hats]  # voice only the first of these
  skip_velocity_below: {kick: 0, snare: 10, hats: 0}  # labelled hits too soft to voice
  # Per beat (approved 2026-11-09): a beat whose four straight 16ths all have hats gets one
  # coin flip; on thinning, its two off-8th hats go. Other hat figures stay as played.
  thin_16th_hats_to_8ths_prob: 0.5
  voice_cymbals_and_toms: false
  open_hat_sound: hho               # for drum_map.hihat_open notes
  hats_sound: hhc                   # for every other hats note (closed, pedal, ride, bell)

# --- Spec §6: realistic sloppiness (ranges are [low, high]) ----------------------
# null = off until the music lead has listened.
sloppiness:
  offset_ms: [-20, 20]              # steady rush or drag, same for the whole clip
  jitter_ms: [0, 40]                # per-hit timing wobble
  tempo_drift_pct: [0, 0]           # over the clip; off for v0 (2026-11-09), was [0, 8]
  swing_drift_per_bar: null         # spec says "small random change"; needs a number
  drop_prob:
    kick: [0, 0.05]
    snare: [0, 0.05]
    hats: [0, 0.4]
  snr_db: [10, 40]
  mic_eq: null                      # spec says "mild random EQ"; needs numbers

# --- Spec §7: how people tap a beat ---------------------------------------------
taps:
  low: [kick]
  high: [snare, hats]
  simultaneous: low                 # one tap on this hand when both hands coincide
